# Execução local dos três serviços. Copie .env.example para .env antes de subir.
# Na nuvem, cada serviço é gerenciado pelo Ansible (ver ansible/).

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - todo-net
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URI: "mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/todo-app?authSource=todo-app"
    networks:
      - todo-net
    restart: unless-stopped
    healthcheck:
      # GET /todos só responde 200 com a API conectada ao banco
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/todos"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: todo-app
      MONGO_APP_USER: "${MONGO_APP_USER}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD}"
    volumes:
      - mongo-data:/data/db
      - ./banco-de-dados/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./banco-de-dados/seed.json:/docker-entrypoint-initdb.d/seed.json:ro
    networks:
      - todo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  todo-net:
    driver: bridge

volumes:
  mongo-data:
