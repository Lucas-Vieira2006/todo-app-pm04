# Nginx do frontend: serve o React e encaminha a API no mesmo endereço público.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: o nome "backend" é resolvido a cada requisição,
    # então o Nginx sobe mesmo que a API ainda não esteja pronta.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:5000;

    # GET/POST /todos e PATCH/DELETE /todos/:id (caminhos e métodos preservados)
    location = /todos {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /todos/ {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        try_files $uri /index.html;
    }
}
