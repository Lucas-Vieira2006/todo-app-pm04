---
- name: Executar todo-restore-test
  ansible.builtin.command: /usr/local/sbin/todo-restore-test
  register: ops_script
  when: inventory_hostname in groups['db']
  changed_when: false  # teste em contêiner temporário, sem alterar o banco principal

- name: Exibir saída
  ansible.builtin.debug:
    msg: "{{ ops_script.stdout_lines }}"
  when: inventory_hostname in groups['db']
