---
- name: Reiniciar contêineres da aplicação
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
  loop: "{{ ops_app_containers | reverse | list }}"
  when: inventory_hostname in groups['app']

- name: Aguardar contêineres saudáveis
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: ops_restart_health
  until: ops_restart_health.container.State.Health.Status | default('') == 'healthy'
  retries: 24
  delay: 5
  loop: "{{ ops_app_containers }}"
  when: inventory_hostname in groups['app']
