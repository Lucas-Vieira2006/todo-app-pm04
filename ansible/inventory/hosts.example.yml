# Exemplo do inventário gerado pela pipeline (scripts/render-inventory.sh) a partir dos outputs do Terraform.
# O arquivo real (inventory/hosts.yml) não é versionado.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/todo_deploy
    deploy_env: dev
    aws_region: us-east-1
    app_domain: 203-0-113-10.sslip.io
    app_public_ip: 203.0.113.10
    app_private_ip: 10.20.1.10
    db_private_ip: 10.20.2.20
    db_data_volume_id: vol-0123456789abcdef0
    private_subnet_cidr: 10.20.2.0/24
    backup_bucket: todo-app-backups-123456789012
  children:
    app:
      hosts:
        app-1:
          ansible_host: 203.0.113.10
    db:
      hosts:
        db-1:
          ansible_host: 10.20.2.20
          # Acesso pela VM da aplicação (bastion); o banco não tem IP público
          ansible_ssh_common_args: >-
            -o ProxyCommand="ssh -i ~/.ssh/todo_deploy -o StrictHostKeyChecking=accept-new -W %h:%p ubuntu@203.0.113.10"
