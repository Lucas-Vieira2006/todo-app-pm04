[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
forks = 5
timeout = 30
callback_result_format = yaml
display_skipped_hosts = False

[ssh_connection]
pipelining = True
# Primeira conexão aceita a chave do host (VMs novas); conexões seguintes exigem a mesma chave
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
