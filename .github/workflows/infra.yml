name: "Infra: provisionar e configurar"

# Cria ou atualiza o ambiente: Terraform (VMs, rede, acessos, volume) e depois Ansible
# (SO, pacotes, Docker, MongoDB, backups e contêineres da aplicação).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        type: choice
        options: [dev, homolog, prod]
        default: dev
      instance_name:
        description: "Nome da VM da aplicação (a VM do banco recebe o sufixo -db)"
        type: string
        default: vm-pm04
      instance_type:
        description: "Tipo da VM da aplicação"
        type: choice
        options: [t3.micro, t3.small, t3.medium]
        default: t3.micro
      db_instance_type:
        description: "Tipo da VM do MongoDB"
        type: choice
        options: [t3.micro, t3.small, t3.medium]
        default: t3.micro
      docker_image:
        description: "Prefixo das imagens (vazio = ghcr.io/<dono>/todo-app; usa -frontend e -backend)"
        type: string
        default: ""
      docker_tag:
        description: "Tag das imagens da aplicação (ex.: sha-1a2b3c4, gerada pela pipeline App)"
        type: string
        required: true
      update_os:
        description: "Aplicar atualizações do sistema operacional"
        type: boolean
        default: false
      extra_packages:
        description: "Pacotes adicionais (separados por vírgula)"
        type: string
        default: "curl,git,unzip"
      plan_only:
        description: "Somente planejar (não aplica nem configura)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC com a AWS
  packages: read # leitura das imagens no GHCR

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ANSIBLE_FORCE_COLOR: "true"
  EVIDENCE_DIR: ${{ github.workspace }}/run-evidence

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "1. Validar parâmetros"
        id: params
        env:
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_INSTANCE_NAME: ${{ inputs.instance_name }}
          IN_INSTANCE_TYPE: ${{ inputs.instance_type }}
          IN_DB_INSTANCE_TYPE: ${{ inputs.db_instance_type }}
          IN_DOCKER_IMAGE: ${{ inputs.docker_image }}
          IN_DOCKER_TAG: ${{ inputs.docker_tag }}
          IN_UPDATE_OS: ${{ inputs.update_os }}
          IN_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          REPO_OWNER: ${{ github.repository_owner }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          for v in AWS_ROLE_ARN AWS_REGION TF_STATE_BUCKET BACKUP_BUCKET; do
            [[ -n "${!v:-}" ]] || { echo "::error::Variável $v não configurada no GitHub (Settings > Variables)"; exit 1; }
          done
          scripts/validate-params.sh
          cp "$RUNNER_TEMP/pipeline-vars.json" "$EVIDENCE_DIR/pipeline-vars.json"

      - name: "2. Preparar ambiente de execução (Terraform e Ansible)"
        uses: ./.github/actions/setup-tools

      - name: "3. Configurar credenciais (OIDC, sem chaves de acesso)"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: infra-${{ inputs.environment }}-${{ github.run_id }}

      - name: "3b. Preparar chave SSH da pipeline"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "::error::Secret SSH_PRIVATE_KEY ausente no GitHub Environment"; exit 1; }
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/todo_deploy)
          echo "TF_VAR_ssh_public_key=$(ssh-keygen -y -f ~/.ssh/todo_deploy)" >> "$GITHUB_ENV"

      - name: "4. Terraform init (state remoto no S3)"
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=todo-app/$DEPLOY_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: "5. Terraform fmt e validate"
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: "6. Terraform plan"
        id: plan
        working-directory: terraform
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_instance_name: ${{ inputs.instance_name }}
          TF_VAR_instance_type: ${{ inputs.instance_type }}
          TF_VAR_db_instance_type: ${{ inputs.db_instance_type }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_backup_bucket_name: ${{ vars.BACKUP_BUCKET }}
          TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
        run: |
          set +e
          terraform plan -var-file="environments/$TF_VAR_environment.tfvars" \
            -out=tfplan -detailed-exitcode -no-color | tee "$EVIDENCE_DIR/terraform-plan.txt"
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT"; echo "Plano: nenhuma alteração na infraestrutura" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT"; echo "Plano: há alterações a aplicar" ;;
            *) echo "::error::terraform plan falhou"; exit 1 ;;
          esac
          grep -E '^Plan:|No changes' "$EVIDENCE_DIR/terraform-plan.txt" | tail -1 > "$EVIDENCE_DIR/plan-summary.txt" || true

          # Proteção dos dados (REQ-04): a pipeline Infra nunca remove o volume do MongoDB
          terraform show -json tfplan > "$RUNNER_TEMP/tfplan.json"
          deletes='[.resource_changes[] | select(.change.actions | index("delete")) | .address]'
          if jq -e "$deletes | index(\"aws_ebs_volume.mongo_data\")" "$RUNNER_TEMP/tfplan.json" >/dev/null; then
            echo "::error::O plano removeria o volume de dados do MongoDB. Use a pipeline Destroy para desativar o ambiente."
            exit 1
          fi
          jq -r "${deletes}[] | \"::warning::Recurso será recriado ou removido: \(.)\"" "$RUNNER_TEMP/tfplan.json"

      - name: "7. Terraform apply"
        if: ${{ !inputs.plan_only && steps.plan.outputs.changes == 'true' }}
        working-directory: terraform
        run: terraform apply -no-color tfplan | tee "$EVIDENCE_DIR/terraform-apply.txt"

      - name: "8. Obter dados de conexão das VMs"
        if: ${{ !inputs.plan_only }}
        working-directory: terraform
        run: |
          out="$RUNNER_TEMP/tf-outputs.json"
          terraform output -json > "$out"
          jq 'with_entries(.value = .value.value)' "$out" | tee "$EVIDENCE_DIR/terraform-outputs.json"
          {
            echo "APP_SG=$(jq -r .app_security_group_id.value "$out")"
            echo "APP_URL=$(jq -r .app_url.value "$out")"
            echo "APP_IP=$(jq -r .app_public_ip.value "$out")"
          } >> "$GITHUB_ENV"

      - name: "9. Preparar inventário do Ansible e acesso SSH temporário"
        if: ${{ !inputs.plan_only }}
        run: |
          scripts/render-inventory.sh "$RUNNER_TEMP/tf-outputs.json" ansible/inventory/hosts.yml ~/.ssh/todo_deploy
          scripts/ssh-access.sh open "$APP_SG"

      - name: "10. Executar playbook Ansible"
        if: ${{ !inputs.plan_only }}
        working-directory: ansible
        env:
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ansible-playbook playbook.yml -e "@$RUNNER_TEMP/pipeline-vars.json" 2>&1 | tee "$EVIDENCE_DIR/ansible-playbook.log"
          exit "${PIPESTATUS[0]}"

      - name: "11. Verificar serviços e contêineres"
        if: ${{ !inputs.plan_only }}
        working-directory: ansible
        run: |
          ansible-playbook verify.yml -e "@$RUNNER_TEMP/pipeline-vars.json" 2>&1 | tee "$EVIDENCE_DIR/ansible-verify.log"
          test "${PIPESTATUS[0]}" -eq 0
          echo "--- Verificação externa (runner do GitHub) ---" | tee "$EVIDENCE_DIR/external-checks.txt"
          curl -fsS --max-time 15 -o /dev/null -w "GET $APP_URL/ -> HTTP %{http_code}\n" "$APP_URL/" | tee -a "$EVIDENCE_DIR/external-checks.txt"
          curl -fsS --max-time 15 "$APP_URL/todos" | jq -c 'map(.text)' | sed 's/^/GET \/todos -> /' | tee -a "$EVIDENCE_DIR/external-checks.txt"
          if nc -z -w 5 "$APP_IP" 27017; then
            echo "::error::Porta 27017 acessível pela internet"; exit 1
          fi
          echo "Porta 27017 no IP público $APP_IP: fechada (esperado)" | tee -a "$EVIDENCE_DIR/external-checks.txt"

      - name: "12. Resumo da execução"
        if: ${{ always() }}
        env:
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_INSTANCE_NAME: ${{ inputs.instance_name }}
          IN_INSTANCE_TYPE: ${{ inputs.instance_type }}
          IN_DB_INSTANCE_TYPE: ${{ inputs.db_instance_type }}
          IN_UPDATE_OS: ${{ inputs.update_os }}
          IN_PLAN_ONLY: ${{ inputs.plan_only }}
          OUT_IMAGE: ${{ steps.params.outputs.docker_image }}
          OUT_TAG: ${{ steps.params.outputs.docker_tag }}
          OUT_PACKAGES: ${{ steps.params.outputs.extra_packages }}
          JOB_STATUS: ${{ job.status }}
        run: scripts/write-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Fechar acesso SSH temporário
        if: ${{ always() && env.APP_SG != '' }}
        run: scripts/ssh-access.sh close "$APP_SG"

      - name: Remover chave SSH do runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/todo_deploy ansible/inventory/hosts.yml

      - name: Publicar evidências da execução
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-infra-${{ inputs.environment }}-${{ github.run_number }}
          path: run-evidence/
          retention-days: 30
