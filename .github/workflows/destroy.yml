name: "Destroy: desativar ambiente"

# Encerramento após a feira: backup final no S3 e remoção de todos os recursos do ambiente.
# Permanecem (e continuam gerando custo mínimo) os buckets da stack bootstrap e as imagens no GHCR.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a remover"
        type: choice
        options: [dev, homolog, prod]
        default: dev
      confirm:
        description: "Digite DESTRUIR-<ambiente> (ex.: DESTRUIR-dev)"
        type: string
        required: true
      skip_backup:
        description: "Pular o backup final (somente se o banco estiver inacessível)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: destroy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      CONFIRM: ${{ inputs.confirm }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_backup_bucket_name: ${{ vars.BACKUP_BUCKET }}
      TF_VAR_instance_name: vm-pm04 # exigido pela validação; não influencia a remoção
    steps:
      - uses: actions/checkout@v7

      - name: Validar confirmação
        run: |
          [[ "$CONFIRM" == "DESTRUIR-$DEPLOY_ENV" ]] || { echo "::error::Confirmação incorreta: digite DESTRUIR-$DEPLOY_ENV"; exit 1; }

      - name: Preparar ferramentas
        uses: ./.github/actions/setup-tools

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: destroy-${{ inputs.environment }}-${{ github.run_id }}

      - name: Chave SSH e terraform init
        working-directory: terraform
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/todo_deploy)
          echo "TF_VAR_ssh_public_key=$(ssh-keygen -y -f ~/.ssh/todo_deploy)" >> "$GITHUB_ENV"
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=todo-app/$DEPLOY_ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform output -json > "$RUNNER_TEMP/tf-outputs.json"
          echo "APP_SG=$(jq -r '.app_security_group_id.value // empty' "$RUNNER_TEMP/tf-outputs.json")" >> "$GITHUB_ENV"

      - name: Backup final no S3
        if: ${{ !inputs.skip_backup && env.APP_SG != '' }}
        env:
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
        run: |
          scripts/render-inventory.sh "$RUNNER_TEMP/tf-outputs.json" ansible/inventory/hosts.yml ~/.ssh/todo_deploy
          scripts/ssh-access.sh open "$APP_SG"
          cd ansible && ansible-playbook ops.yml -e "deploy_env=$DEPLOY_ENV" -e ops_action=backup

      - name: Fechar acesso SSH temporário
        if: ${{ always() && env.APP_SG != '' }}
        run: scripts/ssh-access.sh close "$APP_SG"

      - name: Plano de remoção
        working-directory: terraform
        run: terraform plan -destroy -var-file="environments/$DEPLOY_ENV.tfvars" -no-color -out=destroy.tfplan

      - name: Remover recursos do ambiente
        working-directory: terraform
        run: terraform apply -no-color destroy.tfplan

      - name: Inventário pós-desativação
        if: ${{ always() }}
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          remaining="$(cd terraform && terraform state list 2>/dev/null | wc -l)"
          backups="$(aws s3 ls "s3://$BACKUP_BUCKET/$DEPLOY_ENV/" 2>/dev/null | grep -c archive.gz || true)"
          {
            echo "## Desativação de \`$DEPLOY_ENV\`: ${{ job.status }}"
            echo ""
            echo "- Recursos restantes no state do ambiente: $remaining"
            echo "- Removidos: VMs, Elastic IP, volumes EBS (inclusive o de dados), VPC, sub-redes, Security Groups, papel IAM da VM"
            echo "- Destino dos dados: $backups backup(s) em s3://$BACKUP_BUCKET/$DEPLOY_ENV/ (expiram pela regra de retenção do bucket)"
            echo "- Continuam gerando custo (pequeno): bucket de backups e bucket do state s3://$TF_STATE_BUCKET"
            echo "- Permanecem no GHCR as imagens da aplicação (sem custo para repositório público)"
            echo "- Para remover tudo: esvaziar e apagar os buckets e executar terraform destroy na stack terraform/bootstrap"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remover chave SSH do runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/todo_deploy ansible/inventory/hosts.yml
